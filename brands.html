<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/f3c98c3bc5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-thin-straight/css/uicons-thin-straight.css">
    <link rel="stylesheet"href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
</head>
<body>
    <header class=" header">
        <div class="logo">
            <h1>Relógio</h1>
            <p> TIME REDEFINES</p>
        </div>

        <nav class="nav-bar">
            <a href="home.html"> Home </a>
            <a href="shop.html"> Shop </a>
            <a href="brands.html"> Brands </a>
            <a href="about.html"> About </a>
            <a href="contact.html"> Contact </a>
        </nav>
        <div class="search-sec">
           <input type="text" placeholder="Search for watches, brands..." class="search" >
           <i class="fa-solid fa-magnifying-glass-minus"></i>
        </div>

        <i class="fa-solid fa-user"></i>

        <label class="favourite">
             <input type="checkbox" aria-label="Add to favourites">

            <svg viewBox="0 0 24 24" aria-hidden="true">
               <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
           </svg>
       </label>
    </header>

    <hr>

    <section class="all-brandsimg">
        <img src="Img/Tissot.png" alt="brand">
        <img src="Img/Seiko.png" alt="brand">
        <img src="Img/rolex.png" alt="brand">
        <img src="Img/omega.png" alt="brand">
        <img src="Img/citizen.jpeg" alt="brand">
        <img src="Img/casio.png" alt="brand">
    </section>

    <footer class="f-content">
        <div>
            <h1>Relógio</h1>
            <p> TIME. REDEFINES.</p>
        </div>

        <div class="news">
            <h2> Join our Newsletter</h2>
            <p> Get our new arrivals, exclusive deals, and more!</p>
            <input type="email" placeholder="Enter your email" class="email">
            <button class="subscribe"> <i class="fa-solid fa-right-long"></i> </button>
        </div>

        <div>
            <h2> Follow Us</h2>
            <div class="socials">
                <a href=""><i class="fa-brands fa-facebook"></i></a>
                <a href=""><i class="fa-brands fa-twitter"></i></a>
                <a href=""><i class="fa-brands fa-instagram"></i></a>
                <a href=""><i class="fa-brands fa-linkedin-in"></i></a>
                <a href=""><i class="fa-brands fa-youtube"></i></a>
                <a href=""><i class="fa-brands fa-tiktok"></i></a>
            </div>
        </div>
    </footer>

    <div class="copyright">
        <p>&copy; 2026 Relógio. All rights reserved.</p> 
    </div>
</body>
</html>
