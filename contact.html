<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/f3c98c3bc5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-thin-straight/css/uicons-thin-straight.css">
    <link rel="stylesheet"href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
</head>
<body>
    <header class=" header">
        <div class="logo">
            <h1>Relógio</h1>
            <p> TIME REDEFINES</p>
        </div>

        <nav class="nav-bar">
            <a href="home.html"> Home </a>
            <a href="shop.html"> Shop </a>
            <a href="brands.html"> Brands </a>
            <a href="about.html"> About </a>
            <a href="contact.html"> Contact </a>
        </nav>
        <div class="search-sec">
           <input type="text" placeholder="Search for watches, brands..." class="search" >
           <i class="fa-solid fa-magnifying-glass-minus"></i>
        </div>

        <i class="fa-solid fa-user"></i>

        <label class="favourite">
             <input type="checkbox" aria-label="Add to favourites">

            <svg viewBox="0 0 24 24" aria-hidden="true">
               <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
           </svg>
       </label>
    </header>


    <section class="everything-cnt">
        <div class="contact-content">
            <div class="contact-title">
                <h1>Get In Touch</h1>
                <p> We Love to Hear from You.</p>
            </div>

           <div class="contact-means">
                <div class="contact-email">
                    <i class="fa-regular fa-envelope"></i>
                    <div class="medium"> 
                        <p>Email</p>
                        <p>ebekachidozie22@gmail.com</p>
                    </div>
                </div>

                <div class="contact-tel">
                    <i class="fa-solid fa-phone"></i>
                    <div class="medium"> 
                        <p>Tel</p>
                        <p>07040657519</p>
                    </div>
                </div>

                <div class="address">
                    <i class="fa-solid fa-location-dot"></i>
                    <div class="medium"> 
                        <p>Address</p>
                        <p>Appmart integrated Ltd.</p>
                    </div>
                </div>

                <div class="media">
                    <h3>Follow Us</h3>
                    <a href=""><i class="fa-brands fa-facebook"></i></a>
                    <a href=""><i class="fa-brands fa-twitter"></i></a>
                    <a href=""><i class="fa-brands fa-instagram"></i></a>
                    <a href=""><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href=""><i class="fa-brands fa-youtube"></i></a>
                    <a href=""><i class="fa-brands fa-tiktok"></i></a>
                </div>
            </div> 
        </div>

        <div class="contact-form">
            <div class="credential">
                <p> Name </p>
                <input type="text" id="name" placeholder="Your Name" class="txt-needed">
            </div>

            <div class="credentials">
                <p>Email</p>
                <input type="email" id="name" placeholder="Your email" class="txt-needed">
            </div>

            <div class="credentials">
                <p>Message</p>
                <input type="text" id="name" placeholder="Your Message" class="msg-needed">
            </div>

            <button class="sentbtn"> Send Message</button>
        </div>
    </section>
</body>
</html>
